<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 270" role="img" aria-labelledby="title desc"><title id="title">DFA subset construction for a union b</title><desc id="desc">Start subset D0 has transitions on a to accepting D1 and b to accepting D2. Both accepting states transition on unmatched symbols to the non-accepting empty-set sink.</desc><rect width="760" height="270" rx="22" fill="#f5fbfa"/><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0 9 3 0 6z" fill="#245c59"/></marker></defs><g fill="none" stroke="#245c59" stroke-width="4" marker-end="url(#arrow)"><path d="M134 135 275 82"/><path d="M134 135 275 188"/><path d="M370 92 500 132"/><path d="M370 178 500 138"/></g><g fill="#fff" stroke="#153c39" stroke-width="4"><circle cx="100" cy="135" r="34"/><circle cx="330" cy="70" r="34"/><circle cx="330" cy="200" r="34"/><circle cx="550" cy="135" r="34"/><circle cx="330" cy="70" r="28"/><circle cx="330" cy="200" r="28"/></g><g font-family="system-ui,sans-serif" text-anchor="middle" fill="#153c39"><g font-size="18"><text x="100" y="140">D0</text><text x="330" y="75">D1</text><text x="330" y="205">D2</text><text x="550" y="140">D∅</text></g><g font-size="17" font-weight="700"><text x="205" y="84">a</text><text x="205" y="205">b</text><text x="433" y="92">b</text><text x="433" y="200">a</text></g><g font-size="15"><text x="100" y="190">start</text><text x="330" y="27">final</text><text x="330" y="258">final</text><text x="550" y="195">sink</text></g></g></svg>
