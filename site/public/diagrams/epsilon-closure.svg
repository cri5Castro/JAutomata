<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 250" role="img" aria-labelledby="title desc"><title id="title">Epsilon closure with a two-state cycle</title><desc id="desc">States zero and one form an epsilon cycle. State one has an a transition to accepting state two. The closure of state zero is states zero and one.</desc><rect width="760" height="250" rx="22" fill="#f5fbfa"/><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0 9 3 0 6z" fill="#245c59"/></marker></defs><g fill="none" stroke="#245c59" stroke-width="4" marker-end="url(#arrow)"><path d="M130 125h125"/><path d="M255 155q-64 78-125 0" stroke-dasharray="8 7"/><path d="M335 125h135"/></g><g fill="#fff" stroke="#153c39" stroke-width="4"><circle cx="100" cy="125" r="30"/><circle cx="305" cy="125" r="30"/><circle cx="520" cy="125" r="30"/><circle cx="520" cy="125" r="24"/></g><g font-family="system-ui,sans-serif" font-size="19" text-anchor="middle" fill="#153c39"><text x="100" y="131">0</text><text x="305" y="131">1</text><text x="520" y="131">2</text><text x="190" y="104">ε</text><text x="215" y="218">ε</text><text x="401" y="104">a</text><text x="100" y="185">seed</text><text x="520" y="185">accept</text></g></svg>
