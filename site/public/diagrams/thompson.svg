<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 230" role="img" aria-labelledby="title desc"><title id="title">Thompson NFA for a dot b</title><desc id="desc">Four states. State zero moves on a to state one, then an epsilon transition leads to state two, which moves on b to accepting state three.</desc><rect width="760" height="230" rx="22" fill="#f5fbfa"/><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0 9 3 0 6z" fill="#245c59"/></marker></defs><g fill="none" stroke="#245c59" stroke-width="4" marker-end="url(#arrow)"><path d="M105 115h75"/><path d="M260 115h95" stroke-dasharray="8 7"/><path d="M435 115h75"/></g><g font-family="system-ui, sans-serif" font-size="22" font-weight="700" fill="#153c39"><text x="141" y="92">a</text><text x="301" y="92">ε</text><text x="471" y="92">b</text></g><g fill="#fff" stroke="#153c39" stroke-width="4"><circle cx="75" cy="115" r="30"/><circle cx="230" cy="115" r="30"/><circle cx="405" cy="115" r="30"/><circle cx="560" cy="115" r="30"/><circle cx="560" cy="115" r="24"/></g><g font-family="system-ui, sans-serif" font-size="19" text-anchor="middle" fill="#153c39"><text x="75" y="121">0</text><text x="230" y="121">1</text><text x="405" y="121">2</text><text x="560" y="121">3</text><text x="75" y="175">start</text><text x="560" y="175">accept</text></g></svg>
