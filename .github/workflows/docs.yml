name: Verify and deploy learning site

on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version-file: site/.node-version
          cache: npm
          cache-dependency-path: site/package-lock.json
      - name: Set up uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2
        with:
          enable-cache: true
      - name: Verify Python package and generated learning data
        working-directory: .
        env:
          UV_CACHE_DIR: /tmp/kandalf-uv-cache
        run: |
          uv run --project python python -m unittest discover -s python/tests -v
          uv run --project python python python/scripts/generate_api_docs.py --check
          uv run --project python python python/scripts/generate_teaching_traces.py --check
      - name: Install site dependencies
        run: npm ci
      - name: Check and build site serially
        run: |
          npm run check
          npm run build
      - name: Install Chromium for Playwright
        env:
          PLAYWRIGHT_BROWSERS_PATH: /tmp/jautomata-playwright
        run: npm exec playwright install --with-deps chromium
      - name: Run production browser checks
        env:
          PLAYWRIGHT_BROWSERS_PATH: /tmp/jautomata-playwright
        run: npm run test:e2e
      - name: Check built links, assets, and anchors
        run: npm run test:links
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9
        with:
          path: site/dist

  deploy:
    if: github.ref == 'refs/heads/master' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346
